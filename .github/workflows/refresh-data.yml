name: Refresh Quran data

# The Quran Foundation developer terms require offline copies to come from Content Sync and to be
# re-synced at least every 7 days, so the snapshots are fetched, the data regenerated and checked,
# and the site redeployed twice a week.
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync, regenerate and check
        run: tools/rebuild_data.sh
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/data.rs explore/assets/similar.json explore/assets/themes.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Quran data from Quran Foundation Content Sync"
          git push
      - name: Redeploy the site
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
