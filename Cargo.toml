[workspace]
resolver = "3"
members = ["core", "ui", "timeline", "explore"]

[workspace.dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "History"] }

[profile.release]
opt-level = "z"
lto = true
